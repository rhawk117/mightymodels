[project]
name = "mightymodels-mcp"
version = "0.1.0"
description = "The MCP server for mightymodels"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "mightymodels-core",
    "pydantic>=2.14.1",
]

[project.scripts]
mightymodels-mcp = "mightymodels_mcp.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
mightymodels-core = { workspace = true }
