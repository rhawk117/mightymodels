version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: "main"
    open-pull-requests-limit: 30
    versioning-strategy: "auto"
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: "sunday"
      time: "09:00"
      timezone: "America/New_York"


  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/New_York"
