[project]
name = "python-harness-plugin"
version = "0.1.0"
description = "The CLI behind the python-harness Claude Code plugin: facts about a Python project as JSON, and the plugin's hook handlers"
readme = "README.md"
authors = [{ name = "rhawk117", email = "hawkinsry19@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
]

[project.scripts]
python-harness = "python_harness.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "python_harness"
wheel-exclude = ["tests", "**/tests/**", "**/tests"]
