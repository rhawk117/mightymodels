[project]
name = "ai-engineer-plugin"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.22.0",
    "pyyaml>=6",
]

[project.scripts]
ai-engineer = "ai_engineer_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_engineer_cli"
