[pytest]
strict = true
strict_markers = true
anyio_mode = "auto"
testpaths = ["tests"]
empty_parameter_set_mark = "fail_at_collect"
faulthandler_timeout = "60"
faulthandler_exit_on_timeout = true
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "3"

python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--tb=short",
    "--durations=10",
    "--showlocals",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
filterwarnings = ["error"]

markers = [
    "smoke: runs an entry-point concept through real resources (open_state)",
    "unit: uses fakes and memory only",
    "integration: touches SQLite (file or in-memory), real git, a child process or the filesystem",
    "regression: tests something which previously failed before",
    "agents: test case markers focused on AI code generation quality",
]
