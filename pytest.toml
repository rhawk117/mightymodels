[pytest]
strict = true
testpaths = ["packages/*/src/*"]
empty_parameter_set_mark = "fail_at_collect"

faulthandler_timeout = "60"
faulthandler_exit_on_timeout = true
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "3"

python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--tb=short",
    "--durations=10",
    "--showlocals",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
filterwarnings = ["error"]

markers = [
    "smoke: a quick sanity check",
    "unit: tests behavior without spinning up something heavy",
    "integration: tests requiring external services or processes",
    "regression: tests something which previously failed before",
]
