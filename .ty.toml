[environment]
python-version = "3.14"
python-platform = "all"
root = ["plugins"]

[src]
include = ["plugins"]
respect-ignore-files = true
exclude-scripts = true
exclude = [
    "plugins/**/assets/*.template.py",
    "plugins/**/assets/template/**",
    "plugins/mightymodels/skills/agents-assemble/scripts/task_state.py",  # T3
    "plugins/mightymodels/skills/game-plan/scripts/verification.py",  # T3
    "plugins/mightymodels/skills/game-plan/tests/test_verification.py",  # T3
    "plugins/mightymodels/skills/review-circus/scripts/review_state.py",  # T4
    "plugins/mightymodels/skills/baton-pass/scripts/snapshot.py",  # T5
    "plugins/mightymodels/skills/prune-ticket/scripts/archive_ticket.py",  # T5
    "plugins/mightymodels/skills/lets-investigate/scripts/ledger.py",  # T6
]

[analysis]
respect-type-ignore-comments = true
strict-equality-semantics = true
strict-generic-narrowing = true

[rules]
all = "error"
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-type-argument = "error"
dynamic-function-decorator-return = "warn"
missing-override-decorator = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsound-assignment = "warn"
unsound-return-statement = "warn"
unsound-yield = "warn"
unsupported-dynamic-base = "warn"

[terminal]
error-on-warning = true
output-format = "full"

[[overrides]]
include = ["plugins/**/tests/**"]

[overrides.rules]
unresolved-import = "ignore"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"
